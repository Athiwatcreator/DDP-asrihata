<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Responsive</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
}
table {
width: 100%;
height: 100%;
border-collapse: collapse;
border: 1px solid #444;
}
td {
box-sizing: border-box;
padding: 20px;
font-family: sans-serif;
font-size: 18px;
border: 1px solid #666;
width: 50%;
}
.first-box {
background-color: #b5ba77;
color: #1a4329;
}
.second-box {
background-color: #f7beaa;
color: #7b241c;
}
</style>
</head>
<body>

<table>
<tr>
<td class="first-box">First cell</td>
<td class="second-box">Second cell</td>
</tr>
</table>

</body>
</html>
