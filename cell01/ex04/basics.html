<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basics</title>
  <style>
    body {
      background-color: pink;
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      color: white;
      text-align: center;
      font-size: 3em;
    }
    .shops {
      display: flex;
      justify-content: center;
      gap: 60px;
    }
    .shop {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .shop img {
      width: 128px;
      height: 128px;
    }
    hr {
      width: 100%;
      margin: 40px 0 20px;
    }
    footer {
      text-align: right;
      font-style: italic;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Basics &amp; Home ♥</h1>

  <div class="shops">
    <div class="shop">
      <img src="https://www.google.com/s2/favicons?domain=amazon.com&sz=128" alt="Amazon">
      <a href="https://www.amazon.com">Amazon</a>
    </div>
    <div class="shop">
      <img src="https://www.google.com/s2/favicons?domain=ebay.com&sz=128" alt="eBay">
      <a href="https://www.ebay.com">eBay</a>
    </div>
  </div>
  
  <hr>

  <footer>© asrihata 2026</footer>
</body>
</html>
