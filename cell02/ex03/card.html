<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile Card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <h1>User Profile Card</h1>

  <div class="card">
    <table>
      <tr>
        <td><img class="profile" src="Profile.jpeg" alt="Profile picture"></td>
      </tr>
      <tr>
        <td class="login">your_login</td>
      </tr>
      <tr>
        <td class="desc">Student, Coder</td>
      </tr>
      <tr>
        <td class="social">
          <a href="https://twitter.com"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
          <a href="https://linkedin.com"><img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn"></a>
          <a href="https://facebook.com"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"></a>
        </td>
      </tr>
    </table>
    <a class="contact" href="mailto:you@example.com">Contact</a>
  </div>
</body>
</html>
